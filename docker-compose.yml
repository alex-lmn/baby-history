services:
  db:
    image: postgres:15-alpine
    container_name: baby-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-babyfoot}
      POSTGRES_USER: ${DB_USER:-baby}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baby}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - baby-app
      - baby-monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baby} -d ${DB_NAME:-babyfoot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: baby-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-babyfoot}
      DB_USER: ${DB_USER:-baby}
      DB_PASSWORD: ${DB_PASSWORD:-baby}
      OTEL_SERVICE_NAME: baby-backend
      OTEL_PROM_PORT: 9464
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baby-app
      - baby-monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: baby-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - baby-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: baby-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - baby-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: baby-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - baby-app
      - baby-monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: baby-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-baby}:${DB_PASSWORD:-baby}@db:5432/${DB_NAME:-babyfoot}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baby-app
      - baby-monitoring

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: baby-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter
      - postgres-exporter
      - backend
    networks:
      - baby-monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: baby-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - baby-monitoring

volumes:
  db_data:
  prom_data:
  grafana_data:

networks:
  baby-app:
    driver: bridge
  baby-monitoring:
    driver: bridge

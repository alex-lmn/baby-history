global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'baby-backend'
    static_configs:
      - targets: ['backend:9464']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # prom-client Node.js — dashboard 11159
  - job_name: 'baby-backend-nodejs'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'

  # nginx-prometheus-exporter — dashboard 14900
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
